<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkanoid Liga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#060a0f;--neon:#00FF66;--glow:rgba(0,255,102,.35);--ft:'Bebas Neue',sans-serif;--fu:'Space Grotesk',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);background-image:radial-gradient(circle at 50% 0%,#0d1520 0%,transparent 60%),linear-gradient(0deg,rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:100% 100%,24px 24px,24px 24px;color:#fff;font-family:var(--fu);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none}
  #hd{text-align:center;margin-bottom:6px}
  h1{font-family:var(--ft);font-size:32px;letter-spacing:3px;margin:0;text-shadow:0 0 12px var(--glow);transform:skewX(-4deg)}
  .sub{font-size:11px;color:var(--neon);text-transform:uppercase;letter-spacing:4px;font-weight:600;margin-top:2px}
  #hud{display:flex;justify-content:space-between;width:min(760px,calc(145vh - 153px),calc(100vw - 28px));font-size:13px;color:#5a6a7a;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding:0 8px}
  #hud .v{color:#fff;font-family:var(--ft);font-size:22px;margin-left:5px;text-shadow:0 0 6px rgba(255,255,255,.2)}
  #wrap{position:relative;box-shadow:0 14px 36px rgba(0,0,0,.7),0 0 0 1px #1a2530;border-radius:6px;background:#070b10}
  #stage{display:grid;grid-template-columns:minmax(0,auto) 180px;gap:14px;align-items:start}
  #wrap::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:6px;z-index:10;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.1) 2px,rgba(0,0,0,.1) 4px)}
  canvas{display:block;width:min(760px,calc(145vh - 153px),calc(100vw - 28px));height:auto;border-radius:6px;touch-action:none}
  #ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,10,15,.93);backdrop-filter:blur(8px);text-align:center;padding:28px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  #ov.h{display:none}
  #ov h2{font-family:var(--ft);font-size:52px;margin:0 0 4px;transform:skewX(-4deg);letter-spacing:2px}
  #ov h2.ok{color:var(--neon);text-shadow:0 0 20px var(--glow)}
  #ov h2.fail{color:#ff4444;text-shadow:0 0 20px rgba(255,68,68,.4)}
  #ov h2.win{color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.4)}
  #ov .badge{width:80px;height:80px;border-radius:50%;margin:0 auto 10px;object-fit:contain;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.08)}
  #ov p{margin:0 0 12px;font-size:14px;color:#6a7a8a;max-width:400px;line-height:1.5}
  #nameRow{display:grid;gap:5px;width:min(260px,90%);margin:0 0 14px;text-align:left;color:#7f91a3;font-size:10px;text-transform:uppercase;letter-spacing:1px}
  #nameRow[hidden]{display:none}
  #player{width:100%;padding:9px 11px;border:1px solid #243447;border-radius:4px;outline:none;background:#090f17;color:#fff;font:600 14px var(--fu);text-transform:uppercase}
  #player:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,255,102,.1)}
  #rank{height:100%;padding:12px;border:1px solid #1a2530;border-radius:6px;background:rgba(7,11,16,.92)}
  #rank h3{margin:0 0 9px;color:var(--neon);font:22px var(--ft);letter-spacing:2px}
  #rankList{display:grid;gap:5px;list-style:none}
  #rankList li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:5px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:10px;color:#718096}
  #rankList .nm{overflow:hidden;color:#dbe7f3;text-overflow:ellipsis;white-space:nowrap}
  #rankList .sc{color:#fbbf24;font-weight:700}
  button{font-family:var(--ft);font-size:22px;background:var(--neon);color:#000;border:none;padding:10px 36px;border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:2px;transition:all .2s;box-shadow:0 0 12px var(--glow);transform:skewX(-4deg)}
  button:hover{background:#fff;box-shadow:0 0 20px rgba(255,255,255,.5);transform:skewX(-4deg) scale(1.04)}
  #ctrl{margin-top:7px;font-size:11px;color:#3a4a5a;text-transform:uppercase;letter-spacing:1px}
  #ctrl span{color:#5a6a7a}
  @media(max-width:820px){#stage{grid-template-columns:1fr}#rank{display:none}}
</style>
</head>
<body>
<div id="hd"><h1>ARKANOID LIGA</h1><div class="sub">Temporada Arcade</div></div>
<div id="hud">
  <div>Jornada <span id="jn" class="v">1/20</span></div>
  <div>Rival <span id="rv" class="v">-</span></div>
  <div>Pts <span id="pt" class="v">0</span></div>
  <div>Vidas <span id="vi" class="v">3</span></div>
</div>
<div id="stage">
  <div id="wrap">
    <canvas id="g" width="640" height="440"></canvas>
    <div id="ov">
      <h2 id="t">ARKANOID LIGA</h2>
      <p id="d">Destruye los ladrillos de cada rival. 20 equipos, 20 jornadas.</p>
      <label id="nameRow">Tu nombre<input id="player" maxlength="12" autocomplete="nickname" placeholder="Jugador"></label>
      <button id="btn">Jugar</button>
    </div>
  </div>
  <aside id="rank" aria-label="Clasificacion Arkanoid"><h3>TOP 10</h3><ol id="rankList"></ol></aside>
</div>
<div id="ctrl"><span>← →</span> Mover &nbsp;|&nbsp; <span>ESPACIO</span> Lanzar &nbsp;|&nbsp; Ratón / Táctil</div>
<script src="/juegos/arkanoid.js?v=1" defer></script>
</body>
</html>
