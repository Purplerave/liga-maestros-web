<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#06090f">
    <title>404 — Liga de Maestros</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#06090f; --fg:#f0f4f8; --muted:#8b9dc3; --accent:#38bdf8; --gold:#fbbf24; }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{background:radial-gradient(800px 400px at 20% 10%, rgba(56,189,248,.08), transparent 60%),radial-gradient(600px 400px at 80% 90%, rgba(251,191,36,.08), transparent 60%),var(--bg);color:var(--fg);font-family:Outfit,system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
        body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px, transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse at center, #000 30%, transparent 70%);pointer-events:none}
        .wrap{position:relative;text-align:center;max-width:560px;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
        .code{font-family:"Bebas Neue",sans-serif;font-size:clamp(6rem,20vw,11rem);font-weight:700;line-height:.9;background:linear-gradient(135deg,var(--gold),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
        h1{font-size:clamp(1.2rem,4vw,1.7rem);font-weight:800;margin:.2rem 0 .7rem}
        p{color:var(--muted);line-height:1.6;margin-bottom:1.75rem;font-size:1rem}
        .score{display:inline-grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;padding:.9rem 1.1rem;margin:1rem 0 1.5rem;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:800}
        .score span{font-size:1.3rem}
        .score em{font-style:normal;color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
        .btns{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
        .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.2rem;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:.2s transform,.2s filter}
        .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
        .btn-primary{color:#03121c;background:linear-gradient(135deg,var(--gold),var(--accent));box-shadow:0 10px 25px rgba(56,189,248,.25)}
        .btn-ghost{color:var(--fg);background:transparent;border-color:rgba(255,255,255,.12)}
        .btn-ghost:hover{background:rgba(255,255,255,.06)}
        @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
        @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>
<body>
    <main class="wrap">
        <div class="code" aria-hidden="true">404</div>
        <h1>Fuera de juego</h1>
        <p>La página que buscas no existe o la han cambiado de banda. Vuelve al terreno de juego y firma tu 1X2.</p>
        <div class="score" aria-hidden="true">
            <div><em>Tú</em><div>4</div></div>
            <span>−</span>
            <div><em>IA</em><div>4</div></div>
        </div>
        <nav class="btns" aria-label="Navegación">
            <a href="/" class="btn btn-primary">⚽ Volver a la portada</a>
            <a href="/landing" class="btn btn-ghost">Qué es Liga de Maestros</a>
        </nav>
    </main>
</body>
</html>
