<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Liga de Maestros</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#06090f;color:#f0f4f8;font-family:"Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .error-page{text-align:center;max-width:480px}
        .error-code{font-family:"Rajdhani","Outfit",sans-serif;font-size:clamp(5rem,15vw,9rem);font-weight:700;line-height:1;background:linear-gradient(135deg,#38bdf8,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
        .error-title{font-size:1.5rem;font-weight:600;margin-bottom:12px;color:#f0f4f8}
        .error-msg{color:#8b9dc3;line-height:1.6;margin-bottom:32px;font-size:1rem}
        .error-btn{display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#06090f;font-weight:700;font-size:1rem;border:none;border-radius:8px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
        .error-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35)}
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-msg">La página que buscas no existe o ha cambiado de ubicación. Vuelve a la portada para seguir con la quiniela.</p>
        <a href="/" class="error-btn">Volver a la portada</a>
    </div>
</body>
</html>
