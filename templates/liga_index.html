<body class="newspaper-ui quiniela-focus newspaper-cover-active" data-jornada="{{ jornada }}" data-assets-v="{{ assets_v }}">

        <section class="panel header-brand-panel">
            <img class="sidebar-brand-image" src="{{ url_for('main.static_files', filename='img/ligademaestroslogo_trans.png', v=assets_v) }}" alt="Liga de Maestros - 1X2 - La Pe&ntilde;a vs IA" loading="lazy">
        </section>

        <header class="topbar-shell">
            <div class="topbar-context">
                <div id="topbar-kicker" class="topbar-kicker">Jornada &middot; La Pe&ntilde;a vs Maestros IA</div>
                <div id="topbar-title" class="topbar-title">Liga de Maestros: Humanos vs IA</div>
            </div>

            <div class="topbar-filters">
                <div class="field-group ticket-jornada-filter">
                    <label for="jornada-nav">Ver jornada</label>
                    <select id="jornada-nav"></select>
                </div>
            </div>

            <div class="topbar-actions">
                <div id="picks-progress-wrap" class="topbar-progress" hidden>
                    <span id="picks-done">0/15</span>
                    <div class="picks-track" aria-hidden="true"><i id="picks-progress-bar"></i></div>
                    <small id="picks-caption" class="sr-only">Todavia no has marcado ningun partido.</small>
                </div>
                <div id="user-profile-nav" class="user-panel"></div>
                <button id="cmdk-trigger" class="cmdk-trigger" type="button" data-no-ripple="true"
                        aria-haspopup="dialog" aria-label="Abrir buscador de comandos (Control o Command mas K)">
                    <span aria-hidden="true">🔍</span>
                    <span class="cmdk-trigger-label">Buscar</span>
                    <kbd class="cmdk-kbd">⌘K</kbd>
                </button>
                <button id="refresh-btn" class="icon-btn" type="button" title="Actualizar (R)" aria-label="Actualizar">↻</button>
                <button id="save-quiniela-btn" class="primary-btn" type="button">Guardar quiniela</button>
                <button id="share-ticket-btn" class="primary-btn" data-analytics="share_click" data-analytics-label="ticket" type="button">Compartir</button>
            </div>

        </header>

        <nav class="newspaper-page-nav" aria-label="Navegaci&oacute;n principal">
            <button class="active" type="button" data-page-action="ALL"><i class="nav-ico" aria-hidden="true">⌂</i><span>Portada</span></button>
            <button type="button" data-page-action="TICKET"><i class="nav-ico" aria-hidden="true">1X2</i><span>Quiniela</span></button>
            <button type="button" data-page-action="LIVE"><i class="nav-ico" aria-hidden="true">●</i><span>Directo</span></button>
            <button type="button" data-page-action="STANDINGS"><i class="nav-ico" aria-hidden="true">☰</i><span>Ligas</span></button>
            <button type="button" data-page-action="SNAKE"><i class="nav-ico" aria-hidden="true">▶</i><span>Juegos</span></button>
            <button type="button" data-page-action="CONTEST"><i class="nav-ico" aria-hidden="true">★</i><span>La Pe&ntilde;a</span></button>
        </nav>

        <main class="main-arena">
            <section id="matches-body" class="arena-content" aria-live="polite"></section>
        </main>
        <nav class="site-legal-links" aria-label="Informaci&oacute;n legal">

    <div id="share-sheet" class="share-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="share-sheet-title">
