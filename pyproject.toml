[project]
name = "liga-maestros"
version = "1.0.0"
description = "Quiniela competitiva humanos vs Maestros IA"
requires-python = ">=3.11"
license = "AGPL-3.0-only"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# Baseline legacy findings are tracked separately; CI still enforces all other rules.
ignore = ["E501", "E741", "F841", "F601", "E402", "B008", "B007", "B904", "S105", "S110", "S112", "S311", "S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"tools/*" = ["S101", "S603", "S607"]
"scripts/*" = ["S101", "S603"]
"reparar_*.py" = ["S101"]
"rellenar_*.py" = ["S101"]
"debug_*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
