name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SECRET_KEY: ci-secret-key
      # Reloj de temporada fijado: sin esto, CURRENT_SEASON_ID se deriva de
      # datetime.now() y los tests que afirman "2026-27" fallan solos el 2027-07-01.
      CURRENT_SEASON_START_YEAR: "2026"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.lock 2>/dev/null || pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy (informativo)
        run: |
          mypy liga_maestros || echo "::warning::mypy found type issues — see logs (will be blocking after 2026-10-01)"

      - name: Dependency security audit
        run: pip-audit -r requirements.lock --progress-spinner off

      - name: Reject databases and private key material
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env$|.*\.(db|sqlite|sqlite3|pem|key)$|id_rsa$|id_ed25519$)'; then
            echo "Sensitive runtime material is tracked by Git."
            git ls-files | grep -Ei '(^|/)(\.env$|.*\.(db|sqlite|sqlite3|pem|key)$|id_rsa$|id_ed25519$)'
            exit 1
          fi
          # Also scan history for db leaks (audit fix #1)
          if git log --all --name-only --pretty=format: | grep -Ei '(^|/).*\.(db|sqlite3?)$' | grep -v ".env.example" | head -1 | grep -q .; then
            echo "Historical .db objects found in git log — verify purge (see SECURITY.md)"
            # Non-blocking for now, but warn
            git log --all --name-only --pretty=format: | grep -Ei '(^|/).*\.(db|sqlite3?)$' | sort -u | head -20
          fi

      - name: Python syntax check
        run: |
          python -m py_compile app.py
          python -m py_compile liga_maestros/__init__.py
          python -m py_compile liga_maestros/workers/web_collector.py
          python -m py_compile tools/ops/LIVE_COLLECTOR.py

      - name: JavaScript syntax check
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(static/js/*.js static/js/**/*.js)
          echo "Comprobando ${#files[@]} ficheros JavaScript"
          for f in "${files[@]}"; do
            node --check "$f"
          done

      - name: Tests (unit + integration, sin readiness)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --ignore=tests/test_ensure_jornada_completa.py --ignore=tests/test_production_readiness.py --cov=liga_maestros --cov-report=term-missing --cov-fail-under=50 2>&1 | tail -50
        # coverage 50% initial threshold (audit asks 80% — ramp up after adding E2E)

      - name: Production readiness (bloqueante)
        run: |
          # Audit fix: Estos tests ya no son informativos. Si la jornada está
          # incompleta el deploy debe fallar. En CI fallan cuando el cambio
          # toca data/, jornadas o seed.
          python -m pytest tests/test_ensure_jornada_completa.py tests/test_production_readiness.py -v -o 'addopts='

      - name: Gate de la jornada vigente (bloqueante)
        shell: bash
        run: |
          # La puerta de arriba valida fixtures de la jornada 75 (Finlandia 2025-26),
          # que ya no alimenta el concurso. Esta valida la jornada que está en juego.
          python -m pytest tests/test_jornada_vigente_gate.py -v -o 'addopts='

      - name: Schema freshness check
        run: |
          # Verify schema.sql is not stale (audit fix #10)
          if [ -f schema.sql ]; then
            echo "schema.sql exists — checking it was generated from current migrations"
            # Best-effort: ensure core tables are present
            grep -q "CREATE TABLE.*usuarios" schema.sql || (echo "schema.sql missing usuarios table" && exit 1)
            grep -q "ux_predicciones_user_jornada_partido" schema.sql || echo "::warning::schema.sql missing predicciones unique index"
          fi
