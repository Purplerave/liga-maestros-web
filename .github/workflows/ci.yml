name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.lock 2>/dev/null || pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy (bloqueante)
        run: mypy liga_maestros

      - name: Dependency security audit
        run: pip-audit -r requirements.lock --progress-spinner off 2>/dev/null || pip-audit -r requirements.txt --progress-spinner off

      - name: Reject databases and private key material
        run: |
          if git ls-files | grep -Ei '(^|/)(\\.env|.*\\.(db|sqlite|sqlite3|pem|key)|id_rsa|id_ed25519)$'; then
            echo "Sensitive runtime material is tracked by Git."
            exit 1
          fi
          # Also scan history for db leaks (audit fix #1)
          if git log --all --name-only --pretty=format: | grep -Ei '(^|/)(.*\\.db|.*\\.sqlite)$' | grep -v ".env.example" | head -1 | grep -q .; then
            echo "Historical .db objects found in git log — verify purge (see SECURITY.md)"
            # Non-blocking for now, but warn
            git log --all --name-only --pretty=format: | grep -Ei '(^|/)(.*\\.db|.*\\.sqlite)$' | sort -u | head -20
          fi

      - name: Python syntax check
        run: |
          python -m py_compile app.py
          python -m py_compile liga_maestros/__init__.py
          python -m py_compile liga_maestros/workers/web_collector.py
          python -m py_compile tools/ops/LIVE_COLLECTOR.py

      - name: JavaScript syntax check
        run: |
          for f in static/js/*.js static/js/**/*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Tests (unit + integration, sin readiness)
        run: python -m pytest -q --ignore=tests/test_ensure_jornada_completa.py --ignore=tests/test_production_readiness.py --cov=liga_maestros --cov-report=term-missing --cov-fail-under=65 2>&1 | tail -50
        # coverage 65% threshold

      - name: Production readiness (bloqueante)
        run: |
          # Audit fix: Estos tests ya no son informativos. Si la jornada está
          # incompleta el deploy debe fallar. En CI fallan cuando el cambio
          # toca data/, jornadas o seed.
          python -m pytest tests/test_ensure_jornada_completa.py tests/test_production_readiness.py -v -o 'addopts='

      - name: Schema freshness check
        run: |
          # Verify schema.sql is not stale (audit fix #10)
          if [ -f schema.sql ]; then
            echo "schema.sql exists — checking it was generated from current migrations"
            # Best-effort: ensure core tables are present
            grep -q "CREATE TABLE.*usuarios" schema.sql || (echo "schema.sql missing usuarios table" && exit 1)
            grep -q "ux_predicciones_user_jornada_partido" schema.sql || echo "::warning::schema.sql missing predicciones unique index"
          fi
